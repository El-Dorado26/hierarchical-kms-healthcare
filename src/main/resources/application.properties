spring.application.name=aes
spring.datasource.url=jdbc:postgresql://localhost:5432/kmsdb
spring.datasource.username=bane
spring.datasource.password=${KMS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

kms.master-key=${KMS_MASTER_KEY}

kms.username-hash-secret=${KMS_USERNAME_HASH_SECRET}
